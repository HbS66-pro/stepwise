# 精简模式（lean）在 headless 实验台里的等价物：
# 相对 desktop 的 standard 只做两件事——删掉整个 delegation 组、persona 后追加「输出约定」。
# 原文照抄自 DSH 桌面版「精简模式」预设（0.2.1-rc.1，2026-10-18 版，第 21-28 行）。
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: system-prompt
  config:
    personaPrefix: You are a coding agent powered by the {{model}} model.
    personaSuffix: |
      输出约定（优先级高于其他风格要求）
      - 你的输出是回答，不是工作汇报：第一句给结论或答案，理由只说可能被质疑的那一条。
      - 任务要文件就直接产出，一次写完；不要额外造过程稿。用户没要文件时，成品留在对话里，不落盘、也不再问「要不要存成文件」。
      - 不复述需求、不列交付物目录、不汇报自查与校验过程、不写「下一步建议」，结尾不追问「还需要吗」。
      - 改动了用户的文件，一句话说清改了什么（这是必要信息，不算过程汇报）。
      - 信息不足、需要用户拍板时照常提问；影响决策的风险照常说。
      - 限制的是废话，不是内容：任务本身复杂时该展开就展开。

