<svg xmlns="http://www.w3.org/2000/svg" width="920" height="236" viewBox="0 0 920 236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="920" height="250" fill="#ffffff"/>
  <text x="40" y="44" font-size="22" font-weight="600" fill="#1f2328">账单三分：钱花在哪</text>
  <text x="40" y="68" font-size="13" fill="#59636e">142 个真实会话，合计 $41.54（闲时价）；条宽＝费用占比，不是 token 占比</text>

  <!-- 堆叠条 40..880 = 840 宽：44% / 34% / 22% -->
  <rect x="40" y="94" width="370" height="56" fill="#0969da"/>
  <rect x="410" y="94" width="286" height="56" fill="#54aeff"/>
  <rect x="696" y="94" width="184" height="56" fill="#b6d9ff"/>

  <text x="225" y="119" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">44%</text>
  <text x="225" y="140" font-size="12" fill="#d7e9ff" text-anchor="middle">输出 29.98M token</text>

  <text x="553" y="119" font-size="20" font-weight="700" fill="#0a3069" text-anchor="middle">34%</text>
  <text x="553" y="140" font-size="12" fill="#0a3069" text-anchor="middle">重读 4,592M token</text>

  <text x="788" y="119" font-size="20" font-weight="700" fill="#0a3069" text-anchor="middle">22%</text>
  <text x="788" y="140" font-size="12" fill="#0a3069" text-anchor="middle">未命中输入 65.18M</text>

  <text x="40" y="192" font-size="15" fill="#1f2328">重读 : 输出 = <tspan font-weight="700">153 : 1</tspan> —— 缓存价便宜 50 倍，被 153 倍的量吃掉三分之一账单。每步约 $0.0014。</text>
  <text x="40" y="218" font-size="14" fill="#59636e">每走一步都会重读整段历史：少一步 = 少一次整段重读 + 少一次完整推理。</text>
</svg>
